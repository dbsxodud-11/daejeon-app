<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대전으로 가는 길</title>
<meta name="theme-color" content="#07111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대전까지">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07111c; --panel:#0c1a29; --sea:#112538;
  --land:#c9b896; --text:#ede5d6; --dim:#8695a6;
  --warm:#f4b551; --rose:#ee7e9b;
  --line:rgba(237,229,214,.13);
  --ko:'Gowun Batang', serif;
  --la:'Archivo', 'Gowun Batang', sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink); color:var(--text); font-family:var(--ko);
  font-size:16px; line-height:1.75; letter-spacing:.005em; -webkit-font-smoothing:antialiased}
main{max-width:470px; margin:0 auto; padding:26px 22px 64px}
.eyebrow{font-family:var(--la); font-size:12.5px; font-weight:500; color:var(--dim); letter-spacing:.04em}
h1{font-size:23px; font-weight:400; line-height:1.5; margin:.35em 0 1.4em}
h1 b{font-weight:700}
.num{font-family:var(--la); font-variant-numeric:tabular-nums}

.globe{position:relative; width:100%; aspect-ratio:1/1; margin:0 0 6px; cursor:grab; touch-action:none}
.globe.dragging{cursor:grabbing}
.globe svg{position:absolute; inset:0; width:100%; height:100%}
#sky{fill:var(--sea)}
.land{fill:var(--land); stroke:rgba(20,32,45,.55); stroke-width:2; fill-rule:evenodd}
.rim{fill:none; stroke:rgba(237,229,214,.22); stroke-width:3}
.route-base{fill:none; stroke:rgba(237,229,214,.30); stroke-width:5; stroke-dasharray:2 15; stroke-linecap:round}
.trail{fill:none; stroke:var(--warm); stroke-width:8; stroke-linecap:round}
.city{fill:rgba(237,229,214,.5)}
.city.done{fill:var(--text)}
.goal circle{fill:none; stroke:rgba(238,126,155,.8); stroke-width:4}
.lbl{font-family:var(--ko); font-size:34px; font-weight:700; fill:var(--text); paint-order:stroke;
     stroke:rgba(7,17,28,.8); stroke-width:9px; stroke-linejoin:round}
.lbl.small{font-size:29px; font-weight:400; fill:rgba(237,229,214,.82)}
.avatar{font-size:78px; text-anchor:middle; dominant-baseline:central}

.state{margin:18px 0 34px; padding-bottom:26px; border-bottom:1px solid var(--line)}
.state .days{display:flex; align-items:baseline; gap:10px}
.state .days strong{font-family:var(--la); font-size:62px; font-weight:500; line-height:.95; letter-spacing:-.02em}
.state .days span{font-size:16px; color:var(--dim)}
.state p{margin:.7em 0 0}

.who{display:grid; grid-template-columns:1fr; gap:14px; padding:18px 0; border-bottom:1px solid var(--line)}
.who h2{margin:0; font-size:17px; font-weight:700; display:flex; align-items:center; gap:8px}
.who h2 em{font-family:var(--la); font-style:normal; font-size:12.5px; font-weight:500; color:var(--dim)}
.who dl{display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin:.6em 0 0; font-size:14.5px}
.who dt{color:var(--dim)}
.who dd{margin:0}
.bar{height:4px; background:var(--line); margin:1.1em 0 0; border-radius:2px; position:relative; cursor:pointer; touch-action:none; -webkit-tap-highlight-color:transparent}
.bar::before{content:''; position:absolute; left:0; right:0; top:-13px; bottom:-13px}
.bar i{display:block; height:100%; background:var(--warm); border-radius:2px; position:relative; pointer-events:none}
.bar .thumb{position:absolute; right:-5px; top:50%; width:10px; height:10px; border-radius:50%;
  background:var(--warm); box-shadow:0 0 0 3px var(--ink); transform:translateY(-50%)}

section{margin:34px 0 0}
h3{font-size:16px; font-weight:700; margin:0 0 .2em}
.hint{color:var(--dim); font-size:14px; margin:.1em 0 1.1em}

.sched{margin:0; padding:0; list-style:none}
.sched li{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:baseline;
          padding:11px 0; border-top:1px solid var(--line); font-size:15px}
.sched .when{font-family:var(--la); font-size:12.5px; line-height:1.45; color:var(--dim); text-align:right}
.sched .la{font-family:var(--la); font-size:12.5px; color:var(--dim); margin-left:6px}
.sched .far{opacity:.55}

input[type=text]{width:100%; background:#0a1523; color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-family:var(--la); font-size:14px}
button{background:transparent; color:var(--text); border:1px solid var(--line); white-space:nowrap;
  border-radius:8px; padding:9px 14px; font-family:var(--ko); font-size:14px; cursor:pointer}
button:hover{border-color:rgba(237,229,214,.4)}
:focus-visible{outline:2px solid var(--warm); outline-offset:2px}
footer{margin-top:30px; color:var(--dim); font-size:13px; line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<main>
  <h1><b>광서</b> 보러<br>열심히 뛰어가는 중~~ 💓</h1>

  <div class="globe" id="globe">
    <svg id="map" viewBox="0 0 1000 1000" aria-label="그르노블에서 대전으로 가는 경로">
      <defs>
        <clipPath id="disc"><circle cx="500" cy="500" r="499"/></clipPath>
        <radialGradient id="glowW"><stop offset="0" stop-color="#f4b551" stop-opacity=".55"/><stop offset="1" stop-color="#f4b551" stop-opacity="0"/></radialGradient>
        <clipPath id="meClip"><circle r="40"/></clipPath>
      </defs>
      <circle id="sky" cx="500" cy="500" r="499"/>
      <g clip-path="url(#disc)">
        <g id="land"></g>
      </g>
      <circle class="rim" cx="500" cy="500" r="499"/>
      <path id="routeBase" class="route-base"/>
      <path id="trail" class="trail"/>
      <g id="cities"></g>
      <g id="labels"></g>
      <circle id="haloW" r="88" fill="url(#glowW)"/>
      <g id="avW">
        <circle r="41" fill="var(--panel)" stroke="var(--warm)" stroke-width="3"/>
        <image href="avatar-me.jpg" x="-40" y="-40" width="80" height="80" clip-path="url(#meClip)" preserveAspectRatio="xMidYMid slice"/>
      </g>
    </svg>
  </div>
  <p class="hint" style="text-align:center; margin:-2px 0 1.1em">끌어서 돌리고, 두 손가락(또는 Ctrl+휠)으로 확대할 수 있어요</p>

  <div class="state">
    <div class="days"><strong id="dLeft" class="num">43</strong><span id="dLabel">일 뒤에 도착합니다</span></div>
    <p id="meetLine">10월 29일 목요일</p>
    <div class="bar" id="barW" tabindex="0" role="slider" aria-label="지금까지 이동한 위치" aria-valuemin="0" aria-valuemax="100"><i id="barFill"><span class="thumb"></span></i></div>
  </div>

  <div class="who">
    <div>
      <h2><span id="nameW">태영</span> <em>Grenoble → Daejeon</em></h2>
      <dl>
        <dt>방금 지난 곳</dt><dd id="lastW">그르노블</dd>
        <dt>다음 도착</dt><dd id="nextW">제네바</dd>
        <dt>지금 내 시각</dt><dd id="clockW">오전 11:40</dd>
      </dl>
    </div>
  </div>

  <div class="who">
    <div>
      <h2><span id="nameE">광서</span> <em>Daejeon</em></h2>
      <dl>
        <dt>기다리는 곳</dt><dd>대전</dd>
        <dt>지금 그곳은</dt><dd id="clockE">오후 6:40, 밤</dd>
      </dl>
    </div>
  </div>

  <section>
    <h3>앞으로의 도착</h3>
    <ul class="sched" id="sched"></ul>
  </section>

</main>

/* ---------- globe rotation ---------- */
const E1=DATA.basis.e1, E2=DATA.basis.e2, E3=DATA.basis.e3;
const GR=499, GCX=500, GCY=500;
let yaw=0, pitch=0, globeDirty=true;
let zoom=1;
const ZMIN=1, ZMAX=4;
function applyZoom(){
  const half=500/zoom;
  $('map').setAttribute('viewBox', `${500-half} ${500-half} ${half*2} ${half*2}`);
}

function unproject(x,y){
  const sx=(x-GCX)/GR, sy=(y-GCY)/GR;
  const z=Math.sqrt(Math.max(0, 1-sx*sx-sy*sy));
  return [sx*E1[0]-sy*E2[0]+z*E3[0], sx*E1[1]-sy*E2[1]+z*E3[1], sx*E1[2]-sy*E2[2]+z*E3[2]];
}
function rotateAxis(v, axis, angle){
  const c=Math.cos(angle), s=Math.sin(angle);
  const d=v[0]*axis[0]+v[1]*axis[1]+v[2]*axis[2];
  const cx=axis[1]*v[2]-axis[2]*v[1], cy=axis[2]*v[0]-axis[0]*v[2], cz=axis[0]*v[1]-axis[1]*v[0];
  return [
    v[0]*c + cx*s + axis[0]*d*(1-c),
    v[1]*c + cy*s + axis[1]*d*(1-c),
    v[2]*c + cz*s + axis[2]*d*(1-c)
  ];
}
const rotateGlobe = v => rotateAxis(rotateAxis(v, E2, yaw), E1, pitch);
function proj(v){
  const r = rotateGlobe(v);
  const dx=r[0]*E1[0]+r[1]*E1[1]+r[2]*E1[2];
  const dy=r[0]*E2[0]+r[1]*E2[1]+r[2]*E2[2];
  const dz=r[0]*E3[0]+r[1]*E3[1]+r[2]*E3[2];
  return { x: GCX+GR*dx, y: GCY-GR*dy, front: dz>-0.01 };
}
function runsToPath(points){
  const runs=[]; let cur=[];
  for (const p of points){
    if (p.front) cur.push(p); else { if (cur.length>1) runs.push(cur); cur=[]; }
  }
  if (cur.length>1) runs.push(cur);
  return runs.map(r=>'M'+r.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L')).join(' ');
}

  $('land').innerHTML = GEO.land.map(vecs=>{
    const pts = vecs.map(proj);
    if (pts.some(p=>!p.front)) return '';
    return `<path class="land" d="M${pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')}Z"/>`;
  }).join('');
  $('routeBase').setAttribute('d', runsToPath(GEO.route.map(proj)));
  const goalP = proj(GOAL_V), homeP = proj(HOME_V);
  $('cities').innerHTML = DATA.cities.map((c,i)=>{
    const p = proj(GEO.cities[i]);
    return `<circle class="city" data-km="${c.km}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" style="${p.front?'':'display:none'}"/>`;
  }).join('') + `<g class="goal" style="${goalP.front?'':'display:none'}"><circle cx="${goalP.x.toFixed(1)}" cy="${goalP.y.toFixed(1)}" r="22"/></g>`;
  $('labels').innerHTML =
    `<text class="lbl" x="${homeP.x.toFixed(1)}" y="${(homeP.y+62).toFixed(1)}" text-anchor="middle" style="${homeP.front?'':'display:none'}">그르노블</text>` +
    `<text class="lbl" id="goalLbl" x="${goalP.x.toFixed(1)}" y="${(goalP.y+70).toFixed(1)}" text-anchor="middle" style="${goalP.front?'':'display:none'}">대전</text>`;
  globeDirty = false;
}

/* ---------- geometry ---------- */
function atIndex(t){
  const i = Math.max(0, Math.min(LAST-1, Math.floor(t)));
  const f = t - i, a = GEO.route[i], b = GEO.route[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function trailPoints(to){
  const pts=[];
  for (let i=0;i<to;i++) pts.push(proj(atIndex(i)));
  pts.push(proj(atIndex(to)));
  return runsToPath(pts);
}
const kmToIndex = km => Math.max(0, Math.min(LAST, (km/DATA.total)*LAST));

/* ---------- sun ---------- */
function subsolar(d){
  const n = d.getTime()/86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474*n) % 360;
  const g = ((357.528 + 0.9856003*n) % 360) * RAD;
  const lam = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * RAD;
  const eps = (23.439 - 4e-7*n) * RAD;
  const dec = Math.asin(Math.sin(eps)*Math.sin(lam));
  const ra = Math.atan2(Math.cos(eps)*Math.sin(lam), Math.cos(lam)) / RAD;
  const eot = ((L - ra + 540) % 360) - 180;
  const utcH = d.getUTCHours() + d.getUTCMinutes()/60;
  return { lat: dec/RAD, lon: ((-15*(utcH-12) - eot) + 540) % 360 - 180 };
}
const unit = (lat,lon)=>{
  const a=lat*RAD, b=lon*RAD;
  return [Math.cos(a)*Math.cos(b), Math.cos(a)*Math.sin(b), Math.sin(a)];
};

function subsolarVec(when){
  const s=subsolar(when);
  return unit(s.lat,s.lon);
}
const isDay = (sv,lat,lon)=>{
  const p=unit(lat,lon);
  return p[0]*sv[0]+p[1]*sv[1]+p[2]*sv[2] > -0.01;
};

/* ---------- state ---------- */
const store={
  get(k,d){ try{ const v=localStorage.getItem('dj.'+k); return v===null?d:JSON.parse(v);}catch(e){return d} },
  set(k,v){ try{ localStorage.setItem('dj.'+k, JSON.stringify(v)); }catch(e){} }
};
const q = new URLSearchParams(location.search);
const cfg={
  start: q.get('from') || store.get('start','2026-08-20'),
  end:   q.get('to')   || store.get('end','2026-11-06')
};
for (const k of ['start','end']) store.set(k, cfg[k]);

const day=86400000;
const parse = s => new Date(s+'T12:00:00Z');
const dayDiff = (a,b) => Math.round((parse(b)-parse(a))/day);
const toDateStr = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const koDate = d => (d.getUTCMonth()+1)+'월 '+d.getUTCDate()+'일';
const KO_FULL = new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long',timeZone:'UTC'});

function cityAt(km){
  let last=null, next=null;
  for (const c of DATA.cities){
    if (c.km <= km+0.5) last=c; else { next=c; break; }
  }
  return {last,next};
}

let viewFrac=null;
function render(mapOnly){
  const total = Math.max(1, dayDiff(cfg.start, cfg.end));
  const now = new Date();
  const elapsedToday = (now - parse(cfg.start)) / day;
  const elapsed = viewFrac===null ? elapsedToday : viewFrac*total;
  const p = Math.max(0, Math.min(1, elapsed/total));
  const shownDate = new Date(parse(cfg.start).getTime() + elapsed*day);
  const instant = viewFrac===null ? now : shownDate;
  const km = p*DATA.total;

  /* map */
  if (globeDirty) drawGlobeStatics();
  const t = kmToIndex(km), pos = proj(atIndex(t));
  $('trail').setAttribute('d', trailPoints(t));
  const goalP = proj(GOAL_V);
  const sep = Math.hypot(goalP.x-pos.x, goalP.y-pos.y);
  const push = sep < 150 ? (150-sep)*0.42 : 0;
  const wy = pos.y-push;
  $('avW').setAttribute('transform',`translate(${pos.x},${wy})`);
  $('avW').style.opacity = $('haloW').style.opacity = pos.front ? 1 : 0;
  $('haloW').setAttribute('cx',pos.x); $('haloW').setAttribute('cy',wy);
  $('goalLbl').style.opacity = (push>24 || !goalP.front) ? 0 : 1;
  document.querySelectorAll('#cities .city').forEach(el=>{
    el.classList.toggle('done', +el.dataset.km <= km+0.5);
  });

  if (mapOnly) return;
  const sv = subsolarVec(instant);

  /* headline */
  $('meetLine').textContent = KO_FULL.format(parse(cfg.end)) + '에 대전';

  /* rows */
  const c = cityAt(km), perDay = DATA.total/total;
  $('lastW').textContent = c.last ? c.last.ko : '출발 전';
  $('nextW').textContent = c.next
    ? `${c.next.ko}까지 ${fmtKm(c.next.km-km)}km, ${Math.max(1,Math.ceil((c.next.km-km)/perDay))}일`
    : '대전 도착';
  $('barFill').style.width = (p*100).toFixed(1)+'%';
  $('barW').setAttribute('aria-valuenow', Math.round(p*100));
  const clock = tz => new Intl.DateTimeFormat('ko-KR',{hour:'numeric',minute:'2-digit',timeZone:tz}).format(instant);
  $('clockW').textContent = clock('Europe/Paris') + ', ' + (isDay(sv,45.19,5.72)?'해가 떠 있음':'밤');
  $('clockE').textContent = clock('Asia/Seoul') + ', ' + (isDay(sv,36.35,127.38)?'해가 떠 있음':'밤');

  /* schedule */
  const up = DATA.cities.filter(x=>x.km>km+0.5).slice(0,8);
  $('sched').innerHTML = up.map((x,i)=>{
    const when = new Date(parse(cfg.start).getTime() + (x.km/DATA.total)*total*day);
    const inDays = Math.max(0, dayDiff(toDateStr(instant), toDateStr(when)));
    return `<li class="${i>4?'far':''}"><span>${x.ko}<span class="la">${x.la}</span></span>
      <span class="when">${koDate(when)}<br>${inDays}일 뒤</span></li>`;
  }).join('');
}

/* ---------- globe drag & zoom ---------- */
(function(){
  const el = $('globe');
  const pointers = new Map();
  let dragging=false, startX=0, startY=0, startYaw=0, startPitch=0, rafPending=false;
  let pinching=false, pinchStartDist=0, pinchStartZoom=1;
  function apply(){
    rafPending=false;
    globeDirty=true;
    render(true);
  }
  function startDragFrom(x,y){
    dragging=true; startX=x; startY=y; startYaw=yaw; startPitch=pitch;
    el.classList.add('dragging');
  }
  el.addEventListener('pointerdown', e=>{
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 2){
      dragging=false; el.classList.remove('dragging');
      pinching=true;
      const [a,b]=[...pointers.values()];
      pinchStartDist=Math.hypot(a.x-b.x, a.y-b.y) || 1;
      pinchStartZoom=zoom;
    } else if (pointers.size === 1){
      startDragFrom(e.clientX, e.clientY);
    }
  });
  el.addEventListener('pointermove', e=>{
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pinching && pointers.size === 2){
      const [a,b]=[...pointers.values()];
      const dist=Math.hypot(a.x-b.x, a.y-b.y) || 1;
      zoom=Math.max(ZMIN, Math.min(ZMAX, pinchStartZoom*dist/pinchStartDist));
      applyZoom();
      return;
    }
    if (!dragging) return;
    const rect = el.getBoundingClientRect();
    yaw = startYaw + (e.clientX-startX)/rect.width*Math.PI;
    pitch = Math.max(-1.3, Math.min(1.3, startPitch - (e.clientY-startY)/rect.height*Math.PI));
    if (!rafPending){ rafPending=true; requestAnimationFrame(apply); }
  });
  function releasePointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinching=false;
    if (pointers.size === 0){
      dragging=false; el.classList.remove('dragging');
      globeDirty=true; render(true);
    } else if (pointers.size === 1){
      const [pt]=[...pointers.values()];
      startDragFrom(pt.x, pt.y);
    }
  }
  el.addEventListener('pointerup', releasePointer);
  el.addEventListener('pointercancel', releasePointer);
  el.addEventListener('wheel', e=>{
    if (!e.ctrlKey && !e.metaKey) return; // plain scroll: let the page scroll normally
    e.preventDefault();
    zoom = Math.max(ZMIN, Math.min(ZMAX, zoom*Math.exp(-e.deltaY*0.0015)));
    applyZoom();
  }, {passive:false});
  el.addEventListener('dblclick', ()=>{
    zoom = zoom>ZMIN+0.1 ? ZMIN : 2.5;
    applyZoom();
  });
})();

/* ---------- progress bar scrub ---------- */
(function(){
  const bar = $('barW');
  let dragging=false;
  function liveFrac(){
    const total = Math.max(1, dayDiff(cfg.start, cfg.end));
    const elapsedToday = (new Date() - parse(cfg.start)) / day;
    return Math.max(0, Math.min(1, elapsedToday/total));
  }
  function apply(e){
    const rect = bar.getBoundingClientRect();
    const x = Math.max(rect.left, Math.min(rect.right, e.clientX));
    const raw = (x-rect.left)/rect.width;
    viewFrac = Math.max(0, Math.min(raw, liveFrac()));
    render();
  }
  bar.addEventListener('pointerdown', e=>{
    dragging=true; bar.setPointerCapture(e.pointerId);
    apply(e);
  });
  bar.addEventListener('pointermove', e=>{
    if (dragging) apply(e);
  });
  function endScrub(){
    if (!dragging) return;
    dragging=false; viewFrac=null; render();
  }
  bar.addEventListener('pointerup', endScrub);
  bar.addEventListener('pointercancel', endScrub);
})();

/* ---------- flight countdown ---------- */
const ARRIVAL = new Date('2026-11-06T08:20:00Z'); // 2026-11-06 오후 5:20 KST
function tickCountdown(){
  const diff = ARRIVAL - new Date();
  if (diff <= 0){ $('dLeft').textContent = ''; $('dLabel').textContent = '도착했습니다!'; return; }
  const s = Math.floor(diff/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        m = Math.floor(s%3600/60), sec = s%60;
  $('dLeft').textContent = d;
  $('dLabel').textContent = `일 ${h}시간 ${m}분 ${sec}초 남았습니다`;
}
tickCountdown();
setInterval(tickCountdown, 1000);

/* ---------- offline ---------- */
if ('serviceWorker' in navigator) {
  addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

/* ---------- one arrival animation ---------- */
render();
if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const total=Math.max(1,dayDiff(cfg.start,cfg.end));
  const target=Math.max(0,Math.min(1,((new Date())-parse(cfg.start))/day/total));
  const t0=performance.now(), dur=1600;
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    viewFrac = target*(1-Math.pow(1-k,3));
    render(true);
    if (k<1) requestAnimationFrame(step); else { viewFrac=null; render(); }
  })(t0);
}
</script>
</body>
</html>
